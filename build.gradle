buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}
        
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = mod_version
group = mod_group_id
archivesBaseName = "${mod_id}-${minecraft_version}"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

// Forge 1.12.2 finds development assets beside the mod's compiled classes.
sourceSets.main.output.resourcesDir = sourceSets.main.output.classesDirs.singleFile

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-14.23.5.2859"
    // Explicit for IDEA's compile classpath; Minecraft supplies this at runtime.
    compileOnly 'io.netty:netty-all:4.1.9.Final'
}

jar {
    from('LICENSE.txt')
    manifest {
        attributes([
            "Specification-Title": mod_id,
            "Specification-Vendor": mod_authors,
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" : mod_authors,
            "Implementation-License": 'GPL-3.0-only',
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar') 

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': minecraft_version
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

